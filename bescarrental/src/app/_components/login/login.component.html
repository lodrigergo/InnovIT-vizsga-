<!-- A panel; a CSS-ben alapértelmezettként rejtve van (pl. right: -500px), de az [class.open] kötés miatt láthatóvá válik, ha isOpen=true -->
<div id="login-panel" class="login-panel" [class.open]="isOpen">
  <div class="login-header">
    <h2>LOGIN</h2>
    <span id="close-login-panel" class="close-btn" (click)="closePanelHandler()">&times;</span>
  </div>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email"><i class="fa fa-envelope"></i> Email:</label>
      <input type="email" id="login-email" [(ngModel)]="email" name="email" placeholder="Email" required>
      <p *ngIf="emailError" style="color:red;font-size:14px;">{{ emailError }}</p>
    </div>
    <div class="form-group">
      <label for="password"><i class="fa fa-key"></i> Password:</label>
      <input type="password" id="login-password" [(ngModel)]="password" name="password" placeholder="Password" required>
      <p *ngIf="passwordError" style="color:red;font-size:14px;">{{ passwordError }}</p>
    </div>
    <a href="#" class="forgot-password">Forgot Password?</a>
    <button type="submit" class="btn login-btn">Log In</button>
    <!-- A Create Account gomb a goToRegister() metódust hívja meg -->
    <button type="button" class="btn create-account-btn" (click)="goToRegister()">Create Account</button>
  </form>
</div>

<!-- Az overlay, amely sötétíti a hátteret, ha a panel nyitva van -->
<div id="overlay" class="overlay" [class.show]="isOpen" (click)="onOverlayClick()"></div>
