<div class="background-container">
<section class="hero">
    <div class="hero-content">
        <h1>Rent a Car Online &</h1>
        <p>Enjoy the Best Deals, Rates & Accessories</p>
        <div class="search-box">
            <form action="#">
                <div class="form-row">
                    <label for="vehicle-type">What type of vehicle?</label>
                    <div class="vehicle-type">
                        <button type="button" class="vehicle-option active">Cars</button>
                        <button type="button" class="vehicle-option">Trucks</button>
                    </div>
                </div>
                <div class="form-row">
                    <label for="location">Pick-up and drop-off location</label>
                    <input type="text" id="location" placeholder="Pick up and drop off location">
                </div>
                <div class="form-row date-time">
                    <div>
                        <label for="pickup-date">Date and time of recording</label>
                        <input type="date" id="pickup-date">
                        <input type="time" id="pickup-time">
                    </div>
                    <div>
                        <label for="dropoff-date">Release date and time</label>
                        <input type="date" id="dropoff-date">
                        <input type="time" id="dropoff-time">
                    </div>
                </div>
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
    </div>
</section>
</div>
